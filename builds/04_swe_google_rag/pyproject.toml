[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-google-rag"
version = "1.0.0"
description = "A transparent local RAG pipeline over Software Engineering at Google PDFs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0,<2.0",
    "numpy>=2.0,<3.0",
    "pypdf>=5.0,<7.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0"]

[project.scripts]
swe-google-rag = "swe_google_rag.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
